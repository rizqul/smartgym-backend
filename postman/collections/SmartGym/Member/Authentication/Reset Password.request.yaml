$kind: http-request
url: "{{apiUrl}}/auth/reset-password"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \    \"email\": \"{{memberEmail}}\",\r

    \    \"code\": \"{{memberResetOtp}}\",\r

    \    \"password\": \"{{memberPassword}}\"\r

    }"
settings:
  disabledSystemHeaders:
    - accept
order: 3000
