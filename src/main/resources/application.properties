spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.address=${SERVER_HOST:0.0.0.0}

app.config.app-url=${APP_URL:http://localhost:3000}
app.config.initial-account-name=${INITIAL_ACCOUNT_NAME:admin}
app.config.initial-account-email=${INITIAL_ACCOUNT_EMAIL:admin@gymmick.my.id}
app.config.initial-account-password=${INITIAL_ACCOUNT_PASSWORD:admin12345}

app.config.cookie-domain=${COOKIE_DOMAIN:.smartgym.my.id}
app.config.cookie-same-site=${COOKIE_SAME_SITE:lax}
app.config.cookie-secure=${COOKIE_SECURE:true}

app.config.jwt-secret=${JWT_SECRET_KEY:jwt-secret}

app.config.aws.s3.bucket=${AWS_BUCKET}
app.config.aws.s3.public-url=${AWS_PUBLIC_URL}

app.config.midtrans.server-key=${MIDTRANS_SERVER_KEY}
app.config.midtrans.client-key=${MIDTRANS_CLIENT_KEY}
app.config.midtrans.signature-key=${MIDTRANS_SIGNATURE_KEY}
app.config.midtrans.production=${MIDTRANS_PRODUCTION:true}
app.config.midtrans.notification-url=${MIDTRANS_NOTIFICATION_URL:http://0.0.0.0:8080/midtrans/notification}
app.config.midtrans.membership.redirect-url=${MIDTRANS_MEMBERSHIP_REDIRECT_URL:http://0.0.0.0:8080/midtrans/membership}
app.config.midtrans.pt-booking.redirect-url=${MIDTRANS_PT_BOOKING_REDIRECT_URL:http://0.0.0.0:8080/midtrans/pt-booking}

spring.application.name=${APP_NAME:smartgym}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DATABASE_HIBERNATE_DDL:update}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

spring.jackson.mapper.sort-properties-alphabetically=false

spring.cache.type=redis
spring.cache.redis.time-to-live=15m

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:default}
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:null}
spring.mail.password=${MAIL_PASSWORD:null}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.s3.region=${AWS_REGION:auto}
spring.cloud.aws.s3.endpoint=${AWS_ENDPOINT}